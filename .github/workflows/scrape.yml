name: Scrape Fuyouhin Center Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r scripts/requirements.txt
          playwright install chromium
          playwright install-deps
      - run: python scripts/scrape_fuyouhincenter.py
      - uses: actions/upload-artifact@v4
        with:
          name: fuyouhincenter-data
          path: scripts/fuyouhincenter_all_prefectures.xlsx
