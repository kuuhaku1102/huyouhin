name: Scrape Fuyouhin Center Data

on:
  # 手動実行を許可
  workflow_dispatch:
  
  # 毎週日曜日の午後6時（UTC）= 月曜日午前3時（JST）に自動実行
  schedule:
    - cron: '0 18 * * 0'

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps
      
      - name: Run scraping script
        run: |
          cd scripts
          python scrape_fuyouhincenter.py
      
      - name: Upload Excel file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuyouhincenter-data-${{ github.run_number }}
          path: scripts/fuyouhincenter_all_prefectures.xlsx
          retention-days: 30
      
      - name: Commit and push Excel file (optional)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/fuyouhincenter_all_prefectures.xlsx || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update scraped data [automated]" && git push) || true
