name: Auto Blog Post v3 (6-Step SEO)

on:
  schedule:
    # 毎週火・木・土の10時（日本時間） = 1時（UTC）に実行
    - cron: '0 1 * * 2,4,6'
  workflow_dispatch: # 手動実行も可能

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run Auto Blog System v3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
        run: |
          cd scripts
          python auto_blog_v3.py
      
      - name: Commit generated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/article_history.json data/internal_links_db.json data/articles/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update article data [skip ci]"
          git push
