name: Auto Post Column Daily

on:
  schedule:
    # 毎日10時（日本時間 ）= 1時（UTC）に実行
    - cron: '0 1 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install openai requests markdown
      
      - name: Generate and post article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
        run: |
          python auto-post/generate_and_post.py
      
      - name: Commit updated keywords.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add auto-post/keywords.json auto-post/post_log.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update keywords progress [skip ci]"
          git push
